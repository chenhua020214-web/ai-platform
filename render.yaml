services:
  - type: web
    name: ai-platform
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALIYUN_API_KEY
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

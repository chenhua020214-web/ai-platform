name: Keep Render Awake

on:
  schedule:
    # 每 10 分钟执行一次
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render to prevent sleep
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://ai-platform.onrender.com" || echo "ping failed"
          echo "Ping completed at $(date)"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聚合平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ====== 登录/注册 ====== -->
<div class="auth-page">
  <div class="auth-box">
    <h1>🤖 AI 聚合平台</h1>
    <p class="subtitle">DeepSeek · 千问 · OpenAI · 图片 · 视频</p>
    <div class="tab">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>

    <div id="auth-login-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary">登录</button>
      <div class="error" id="login-error"></div>
    </div>

    <div id="auth-register-form" style="display:none;">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="reg-username" placeholder="设置用户名" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="设置密码" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <button id="register-btn" class="btn btn-primary">注册</button>
      <div class="error" id="reg-error"></div>
    </div>
  </div>
</div>

<!-- ====== 主界面 ====== -->
<div class="app-layout">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🤖 AI 平台</h2>
      <div class="badge" id="user-badge"></div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-item active" data-page="chat" onclick="App.navigate('chat')">
        <span class="icon">💬</span><span>AI 对话</span>
      </div>
      <div class="nav-item" data-page="image" onclick="App.navigate('image')">
        <span class="icon">🎨</span><span>图片生成</span>
      </div>
      <div class="nav-item" data-page="video" onclick="App.navigate('video')">
        <span class="icon">🎬</span><span>视频生成</span>
      </div>
      <div class="nav-item" data-page="admin" id="nav-admin" style="display:none;" onclick="App.navigate('admin')">
        <span class="icon">⚙️</span><span>管理面板</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatar-display">👤</div>
        <div class="name"><span id="username-display"></span></div>
        <div class="logout" onclick="App.logout()">退出</div>
      </div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main-content">
    <!-- 顶栏 -->
    <div class="topbar">
      <h3 id="page-title">AI 对话</h3>
    </div>

    <!-- === 对话页 === -->
    <div class="page-content active" id="page-chat">
      <div class="topbar" style="padding:0 0 12px 0;border:none;background:transparent;">
        <div class="model-select">
          <button class="model-btn active" data-model="deepseek" onclick="App.setChatModel('deepseek')">DeepSeek</button>
          <button class="model-btn" data-model="qwen" onclick="App.setChatModel('qwen')">通义千问</button>
          <button class="model-btn" data-model="openai" onclick="App.setChatModel('openai')">OpenAI</button>
          <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="App.clearChat()">清空对话</button>
        </div>
      </div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding-bottom:16px;">
        <div style="text-align:center;padding:80px 20px;color:var(--text2);">
          <div style="font-size:48px;margin-bottom:16px;">💬</div>
          <div style="font-size:16px;margin-bottom:8px;">选择一个模型开始对话</div>
          <div style="font-size:13px;">支持 DeepSeek、通义千问、OpenAI GPT-4o</div>
        </div>
      </div>
      <div class="chat-input">
        <textarea id="chat-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
        <button id="chat-send" class="send-btn" onclick="App.sendChat()">发送</button>
      </div>
    </div>

    <!-- === 图片生成页 === -->
    <div class="page-content" id="page-image">
      <div class="image-form">
        <div class="form-group">
          <label>图片描述词</label>
          <textarea id="image-prompt" placeholder="描述你想生成的图片，比如：一只在樱花树下的白猫，日系动漫风格"></textarea>
        </div>
        <div class="form-group" style="display:flex;gap:8px;align-items:flex-end;">
          <div style="flex:1;">
            <label>模型</label>
            <select id="image-model">
              <option value="dalle">DALL·E 3 (OpenAI)</option>
              <option value="tongyi">通义万相 (阿里云)</option>
            </select>
          </div>
          <button id="image-gen-btn" class="btn btn-primary" onclick="App.generateImage()">生成图片</button>
        </div>
      </div>
      <div class="image-grid" id="image-grid"></div>
    </div>

    <!-- === 视频生成页 === -->
    <div class="page-content" id="page-video">
      <div class="video-form">
        <div class="form-group">
          <label>视频描述词</label>
          <textarea id="video-prompt" placeholder="描述你想生成的视频，比如：一只金毛在沙滩上奔跑，阳光明媚" rows="3"></textarea>
        </div>
        <button id="video-gen-btn" class="btn btn-primary" onclick="App.generateVideo()">生成视频（约1-3分钟）</button>
      </div>
      <div class="video-list" id="video-list">
        <div style="text-align:center;padding:60px;color:var(--text2);font-size:14px;">还没有视频，输入描述词开始生成</div>
      </div>
    </div>

    <!-- === 管理面板 === -->
    <div class="page-content" id="page-admin">
      <div class="admin-stats">
        <div class="stat-card"><div class="num" id="stat-total">-</div><div class="label">总调用次数</div></div>
        <div class="stat-card"><div class="num" id="stat-cost">-</div><div class="label">总费用</div></div>
        <div class="stat-card"><div class="num" id="stat-breakdown" style="font-size:16px;">-</div><div class="label">各模型分布</div></div>
      </div>
      <h4 style="margin-bottom:12px;">用户管理</h4>
      <table class="admin-table">
        <thead><tr><th>用户</th><th>注册时间</th><th>已使用</th><th>每日额度</th><th>使用率</th></tr></thead>
        <tbody id="admin-users"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
